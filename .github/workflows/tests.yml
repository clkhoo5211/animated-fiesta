name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: "tests-${{ github.ref }}", cancel-in-progress: true}
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env: {CI: "1"}
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: playwright-report, path: playwright-report, retention-days: 7}
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: python/requirements.txt}
      - run: pip install -r python/requirements.txt pytest
      - run: pytest -q python/tests
