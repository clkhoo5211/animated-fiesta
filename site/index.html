<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>InvoiceLens</title>
<meta name="description" content="In-browser document extraction: multi-model extraction, arithmetic checks, cross-verification">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bd3'/%3E%3Cpath d='M9 8h11l4 4v12H9z' fill='white'/%3E%3Cpath d='M12 15h9M12 19h6' stroke='%232f5bd3' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--fg:#14161a;--mut:#667085;--line:#e4e7ec;--soft:#f2f4f7;--ac:#2f5bd3;--ac-soft:#eaf0ff;--ok:#12805c;--ok-soft:#e7f6ef;--warn:#b54708;--warn-soft:#fef3e6;--bad:#c4320a;--bad-soft:#fdecea;--r:12px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--panel:#171a21;--fg:#e8eaee;--mut:#98a2b3;--line:#2a2f3a;--soft:#1f232c;--ac:#7c9cff;--ac-soft:#1e2742;--ok:#4cc38a;--ok-soft:#16291f;--warn:#f5a524;--warn-soft:#2d2212;--bad:#ff7a59;--bad-soft:#2f1915;--sh:none}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}.logo i{width:28px;height:28px;border-radius:8px;background:var(--ac);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.sub{color:var(--mut);font-size:13px}.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.btn.pri:hover{filter:brightness(1.07)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{padding:5px 10px;font-size:13px}
main{max-width:1280px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
main>*{min-width:0}
@media (max-width:900px){main{grid-template-columns:1fr}}
@media (max-width:640px){.tabs{flex-wrap:wrap}.tools{margin-left:0;width:100%;overflow-x:auto}.bar .sub{display:none}.kpi.big b{font-size:19px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card h2{font-size:14px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.pad{padding:16px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:.15s;background:var(--soft)}
.drop:hover,.drop.on{border-color:var(--ac);background:var(--ac-soft)}.drop b{display:block;margin-bottom:4px}.drop .sub{font-size:12px}
.file{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:13px;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--mut)}.chip.on{background:var(--ac-soft);color:var(--ac);border-color:transparent}.chip.off{text-decoration:line-through}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:14px}.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px;font-size:13px}.steps li{display:flex;gap:8px;align-items:center;color:var(--mut)}
.steps li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}.steps li.run{color:var(--fg)}.steps li.run::before{background:var(--ac);animation:p 1s infinite}.steps li.done::before{background:var(--ok)}.steps li.err{color:var(--bad)}.steps li.err::before{background:var(--bad)}
@keyframes p{50%{opacity:.3}}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}.tab.on{color:var(--fg);border-color:var(--ac);font-weight:600}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px}
.empty{padding:64px 16px;text-align:center;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px}.kpi>span{font-size:12px;color:var(--mut)}.kpi b{display:block;font-size:17px;margin-top:2px;word-break:break-word}
.kpi.big b{font-size:22px;color:var(--ac)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.mut{background:var(--soft);color:var(--mut)}
.sec{margin-top:18px}.sec h3{font-size:13px;color:var(--mut);font-weight:600;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 12px;font-size:13px}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.box{border:1px solid var(--line);border-radius:10px;padding:12px}.box h4{margin:0 0 8px;font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--soft);font-weight:600;color:var(--mut);font-size:12px;white-space:nowrap}tr:last-child td{border-bottom:0}td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}tr.flag td{background:var(--bad-soft)}
.list{display:grid;gap:8px}.item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px}.item .badge{flex:none}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);padding:14px;border-radius:10px;max-height:70vh;overflow:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
/* settings */
dialog{border:0;padding:0;border-radius:14px;width:min(640px,calc(100vw - 32px));background:var(--panel);color:var(--fg);box-shadow:0 20px 50px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(15,17,21,.45)}
.dh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.dh h2{margin:0;font-size:16px}
.db{padding:4px 20px 8px;max-height:70vh;overflow:auto}.df{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:14px 0 0}legend{font-weight:600;font-size:13px;padding:0 6px}
.f{display:grid;gap:4px;margin-top:10px}.f label{font-size:12px;color:var(--mut)}
.f input,.f select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}.f input:focus,.f select:focus{outline:2px solid var(--ac-soft);border-color:var(--ac)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:560px){.row{grid-template-columns:1fr}}
.pw{position:relative}.pw input{padding-right:56px}.pw button{position:absolute;right:4px;top:4px;bottom:4px;border:0;background:var(--soft);border-radius:6px;padding:0 8px;cursor:pointer;font-size:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px}.chk input{width:auto}
.note{font-size:12px;color:var(--mut);margin-top:8px}.note.warn{color:var(--warn)}
.test{font-size:12px;margin-left:8px}
.queue{display:grid;gap:8px;margin-top:14px}
.job{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;cursor:pointer;background:var(--panel)}
.job:hover{border-color:var(--ac)}.job.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac-soft)}
.job .tn{width:44px;height:56px;border-radius:6px;background:var(--soft);object-fit:cover;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--mut)}
.job .nm{font-size:13px;font-weight:600;word-break:break-all;line-height:1.3}.job .meta{font-size:12px;color:var(--mut);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.job .acts{display:flex;gap:4px}.job .acts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 7px;font-size:12px;cursor:pointer}
.job .acts button:hover{background:var(--soft)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ev{display:inline-block;min-width:3ch;padding:1px 4px;margin:-2px -4px;border-radius:4px;outline:1px dashed var(--line);cursor:text}
.ev:hover{outline-color:var(--ac)}.ev:focus{outline:2px solid var(--ac);background:var(--ac-soft)}
.ed{background:var(--warn-soft);border-radius:3px;box-shadow:0 0 0 2px var(--warn-soft)}
.acts2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(220px,38%) 1fr;gap:16px;align-items:start}.split>*{min-width:0}
.pv{position:sticky;top:76px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft);max-height:calc(100vh - 100px);overflow-y:auto}.pv img{width:100%;display:block;cursor:zoom-in}
@media (max-width:900px){.split{grid-template-columns:1fr}.pv{position:static;max-height:300px}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--ac-soft);border-top-color:var(--ac);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{padding:8px 4px}.prog-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.prog .steps{margin-top:16px;font-size:14px;gap:10px}
.job.running{border-color:var(--ac);background:linear-gradient(90deg,var(--ac-soft),var(--panel) 60%);background-size:200% 100%;animation:sh 1.6s ease-in-out infinite}
@keyframes sh{0%{background-position:100% 0}50%{background-position:0 0}100%{background-position:100% 0}}
#saved{order:9;flex-basis:100%;font-weight:400;font-size:12px}.card h2{flex-wrap:wrap;row-gap:2px}
dialog[open]{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}dialog>form{display:flex;flex-direction:column;min-height:0;max-height:100%}dialog .db{flex:1;min-height:0;max-height:none}
@media (max-width:640px){.bar{gap:8px;padding:10px 12px}.logo{font-size:15px}#open-settings span{display:none}#open-settings{padding:8px 10px}#lang{max-width:120px;padding:7px 4px!important}
  .pad{padding:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.big{grid-column:span 2}.tab{padding:10px 8px}.tools .btn{flex:1 1 auto;justify-content:center}
  .editbar .btn{flex:1 1 auto;justify-content:center}.grid2{grid-template-columns:1fr}.job{grid-template-columns:40px 1fr;}.job .acts{grid-column:1/-1;justify-content:flex-end}
  dialog{width:calc(100vw - 16px)}.kpi b{font-size:15px}.kpi.big b{font-size:20px}.dh,.df{padding:12px 14px}.db{padding:4px 14px 8px}}
[hidden]{display:none!important}
.help{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--ac-soft);font-size:13px;line-height:1.55}.help ol{margin:6px 0 0;padding-left:18px}.help a{color:var(--ac);font-weight:600}.help .warnline{color:var(--warn);margin-top:6px}
#view a{color:var(--ac);text-decoration:none;font-weight:600}#view a:hover{text-decoration:underline}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}.toast.on{opacity:1}
#zoom{width:min(900px,calc(100vw - 32px))}#zoom img{width:100%;display:block}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo"><i>IL</i>InvoiceLens</div>
  <span class="sub" id="status-pill"></span>
  <span class="sp"></span>
  <select id="lang" class="btn" aria-label="Language" style="padding:7px 8px"><option value="en">English</option><option value="zh">中文</option><option value="ms">Bahasa Melayu</option></select>
  <button class="btn" id="open-settings" data-i18n-title="settings">⚙︎ <span data-i18n="settings"></span></button>
</div></header>

<main>
<section>
  <div class="card">
    <h2><span data-i18n="queue"></span> <span class="sub" id="qsum"></span><span class="sub" id="saved" data-i18n-title="autosave_title"></span><span class="sp"></span><button class="btn sm" id="clearq" hidden data-i18n="clear"></button></h2>
    <div class="pad">
      <div class="drop" id="drop" tabindex="0" role="button">
        <b data-i18n="drop_title"></b>
        <span class="sub" data-i18n="drop_sub"></span>
        <input type="file" id="f" accept="image/*,.heic,.heif,.pdf,video/*,.xlsx,.xlsm,.xls,.ods,.csv,.docx" multiple hidden>
      </div>
      
      <div class="chips" id="engine-chips"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn pri" id="go" style="flex:1;justify-content:center" disabled></button>
      </div>
      <div class="queue" id="queue"></div>
    </div>
  </div>
  <p class="note" style="padding:0 4px" data-i18n="privacy"></p>
</section>

<section class="card" id="results">
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="summary" id="tab-summary" hidden><span data-i18n="tab_summary"></span> <span id="sum-count"></span></button>
    <button class="tab" data-tab="recon" id="tab-recon" hidden><span data-i18n="tab_recon"></span> <span id="recon-count"></span></button>
    <button class="tab on" data-tab="overview" data-i18n="tab_overview"></button>
    <button class="tab" data-tab="items" data-i18n="tab_items"></button>
    <button class="tab" data-tab="checks"><span data-i18n="tab_checks"></span> <span id="check-count"></span></button>
    <button class="tab" data-tab="json" data-i18n="tab_json"></button>
    <div class="tools"><button class="btn sm" id="copy" disabled data-i18n="copy_json"></button><button class="btn sm" id="dl" disabled data-i18n="dl_json"></button><button class="btn sm" id="csvall" disabled data-i18n="csv_all"></button><button class="btn sm" id="csv" disabled data-i18n="csv_tables"></button><button class="btn sm" id="csvsum" disabled data-i18n="csv_summary"></button></div>
  </div>
  <div class="pad" id="view"></div>
</section>
</main>

<dialog id="settings">
  <form method="dialog">
  <div class="dh"><h2 data-i18n="settings"></h2><span class="sp"></span><button class="btn sm" value="cancel" data-i18n="close"></button></div>
  <div class="db">
    <fieldset data-slot="a">
      <legend data-i18n="model_a"></legend>
      <div class="f"><label data-i18n="provider"></label><select name="a_prov" class="prov"></select></div>
      <div class="help" data-help="a"></div>
      <div class="row">
        <div class="f"><label data-i18n="type"></label><select name="a_type"><option value="openai" data-i18n="compat"></option><option value="anthropic">Anthropic</option></select></div>
        <div class="f"><label data-i18n="model_name_img"></label><input name="a_model" placeholder="gpt-4o"></div>
      </div>
      <div class="f" data-openai><label>Base URL</label><input name="a_base" list="presets" placeholder="https://api.openai.com/v1"></div>
      <div class="f"><label>API Key</label><div class="pw"><input name="a_key" type="password" autocomplete="off" placeholder="sk-..."><button type="button" class="eye" data-i18n="show"></button></div></div>
      <label class="chk" data-openai><input type="checkbox" name="a_json"> <span data-i18n="json_mode"></span></label>
      <div class="f"><label data-i18n="max_tok"></label><input name="a_maxtok" inputmode="numeric" placeholder="32000"><p class="note" data-i18n="max_tok_hint"></p></div>
      <div class="f"><label data-i18n="price_label"></label><div class="row"><input name="a_price_in" inputmode="decimal" data-i18n-ph="price_in"><input name="a_price_out" inputmode="decimal" data-i18n-ph="price_out"></div></div>
      <div class="chk"><button type="button" class="btn sm test-btn" data-i18n="test_conn"></button><span class="test"></span></div>
    </fieldset>
    <fieldset data-slot="b">
      <legend data-i18n="model_b"></legend>
      <div class="f"><label data-i18n="provider"></label><select name="b_prov" class="prov"></select></div>
      <div class="help" data-help="b"></div>
      <div class="row">
        <div class="f"><label data-i18n="type"></label><select name="b_type"><option value="openai" data-i18n="compat"></option><option value="anthropic">Anthropic</option></select></div>
        <div class="f"><label data-i18n="model_name"></label><input name="b_model" placeholder="claude-sonnet-5-5 / gemini-2.5-flash"></div>
      </div>
      <div class="f" data-openai><label>Base URL</label><input name="b_base" list="presets" data-i18n-ph="same_as_a"></div>
      <div class="f"><label data-i18n="key_b"></label><div class="pw"><input name="b_key" type="password" autocomplete="off"><button type="button" class="eye" data-i18n="show"></button></div></div>
      <label class="chk" data-openai><input type="checkbox" name="b_json"> <span data-i18n="json_mode_s"></span></label>
      <div class="f"><label data-i18n="max_tok"></label><input name="b_maxtok" inputmode="numeric" placeholder="32000"><p class="note" data-i18n="max_tok_hint"></p></div>
      <div class="f"><label data-i18n="price_label"></label><div class="row"><input name="b_price_in" inputmode="decimal" data-i18n-ph="price_in"><input name="b_price_out" inputmode="decimal" data-i18n-ph="price_out"></div></div>
      <div class="chk"><button type="button" class="btn sm test-btn" data-i18n="test_conn"></button><span class="test"></span></div>
    </fieldset>
    <fieldset>
      <legend data-i18n="advanced"></legend>
      <div class="f"><label data-i18n="pdf_text_label"></label><select name="pdf_text"><option value="auto" data-i18n="pdf_auto"></option><option value="image" data-i18n="pdf_image"></option></select></div>
      <label class="chk"><input type="checkbox" name="enhance"> <span data-i18n="enhance"></span></label>
      <label class="chk"><input type="checkbox" name="tiles"> <span data-i18n="tiles"></span></label>
      <div class="f"><label data-i18n="proxy"></label><input name="proxy" placeholder="https://vision-cors-proxy.xxx.workers.dev"></div>
      <label class="chk"><input type="checkbox" name="remember_keys"> <span data-i18n="remember"></span></label>
      <p class="note warn" data-i18n="remember_warn"></p>
    </fieldset>
    <datalist id="presets"><option value="https://api.openai.com/v1"><option value="https://openrouter.ai/api/v1"><option value="https://dashscope.aliyuncs.com/compatible-mode/v1"><option value="https://generativelanguage.googleapis.com/v1beta/openai"><option value="https://api.deepseek.com/v1"></datalist>
  </div>
  <div class="df"><button class="btn sm" type="button" id="clear-settings" data-i18n="clear_settings"></button><span class="sp"></span><button class="btn pri" value="save" id="save-settings" data-i18n="save"></button></div>
  </form>
</dialog>
<dialog id="zoom"><form method="dialog"><img alt=""><div class="df"><span class="sp"></span><button class="btn sm" data-i18n="close"></button></div></form></dialog>
<div class="toast" id="toast"></div>

<script type="module">
const I18N={
en:{
 meta_desc:"In-browser document extraction: multi-model extraction, arithmetic checks, cross-verification",
 settings:"Model settings",queue:"File queue",autosave_title:"Results and edits are autosaved in this browser (IndexedDB)",clear:"Clear",
 drop_title:"Drop, click or paste files (multiple allowed)",drop_sub:"Images (incl. iPhone HEIC) / PDF / Excel / CSV / Word / Video",
 start:"Start extraction",start_n:"Start extraction ({n} files)",running:"Extracting…",privacy:"Everything runs in your browser. Files are only sent to the providers you configure in “Model settings”.",
 tab_summary:"Summary",tab_overview:"Overview",tab_items:"Tables",tab_checks:"Checks",tab_json:"Raw JSON",
 copy_json:"Copy JSON",dl_json:"Download all JSON",csv_all:"Export all fields CSV",csv_tables:"Export tables CSV",csv_summary:"Export summary CSV",
 close:"Close",model_a:"Model A (primary)",model_b:"Model B (optional, for cross-check)",type:"Type",compat:"OpenAI-compatible",
 model_name_img:"Model name (must support images)",model_name:"Model name",show:"Show",hide:"Hide",json_mode:"Use JSON mode (turn off if the provider errors)",json_mode_s:"Use JSON mode",

const kindOf=f=>{const n=f.name.toLowerCase();
  if(/\.(heic|heif)$/.test(n)||/image\/hei[cf]/.test(f.type))return"heic";
  if(f.type==="application/pdf"||n.endsWith(".pdf"))return"pdf";
  if(/\.(xlsx|xlsm|xls|ods)$/.test(n)||/spreadsheet|ms-excel/.test(f.type))return"sheet";
  if(/\.csv$/.test(n)||f.type==="text/csv")return"csv";
  if(/\.docx$/.test(n)||/wordprocessingml/.test(f.type))return"docx";
  if(f.type.startsWith("video/"))return"video";if(f.type.startsWith("image/"))return"image";return null};

const PROMPT=`You are a document data extractor for ANY business document (invoice, receipt, delivery order, invoice register / shipment manifest, purchase order, statement, form...). The page may be rotated or photographed at an angle: read it in its correct orientation.
Return ONE JSON object with this shape (null when absent; all values as strings exactly as printed):
{"document_type":"invoice|receipt|delivery_order|invoice_register|purchase_order|statement|quotation|credit_note|debit_note|packing_list|aging_report|other",
 "title":"heading as printed","document_number","document_date","currency",
 "parties":[{"role":"supplier|customer|bill_to|ship_to|transporter|issuer|other","name","registration_no","tax_id","address","contact"}],
 "fields":[{"label":"label exactly as printed","value":"value as printed"}],
 "tables":[{"name","columns":[{"name":"header as printed","role":"text|id|date|qty|unit_price|amount|number|row_total|debit|credit|balance"}],
   "rows":[["cell", "..."]],"row_kinds":["line|group_header|subtotal|other per row, same length as rows"]|null,"total_row":["cell or null per column"]|null,"printed_row_count":"e.g. 7 from '7 Orders'"|null}],
 "totals":[{"label","value"}],"grand_total","amount_in_words",
 "stamps_and_chops":[{"text","position"}],"handwritten_notes":[{"text","position"}],
 "notes":["printed text that is not a label/value pair: disclaimers, instructions, footer lines"],
 "rotation_degrees":"0|90|180|270 = clockwise turn needed to make the text upright",
 "low_confidence_fields":["path or label of anything you are unsure about"]}
Rules:
- Only output text that is actually on the page. Never invent company names, numbers or rows.
- Put EVERY labelled value on the page into "fields" (one entry per label), even if also used elsewhere. A label with a blank value gets value null.
- Copy IDs, phone numbers, tax IDs and amounts character by character. Unreadable character -> "?" and list the field in low_confidence_fields.
- Payment details (bank name, account name, account number) and footer lines printed as "Label: value" are fields too.
- Printed lines without a value of their own (e.g. "* Private & Confidential", "Please transfer to the account below", "Delivered by") go in notes, not fields.
- Table column headers are not field labels: never repeat table cells in fields.
- Line items (products/services with qty, price or amount) ALWAYS go in tables, even when the table has no ruled lines; never put per-item amounts in totals. totals is only for summary lines printed once (subtotal, discount, tax, rounding, total payable).
- Tables: one row per printed row, cells in column order; put the printed totals line in total_row, not in rows. Column role: qty = quantity, unit_price = price per unit, amount = qty x unit_price, row_total = sum of the other numeric cells in that row, debit / credit = money out / in on a statement, balance = running balance, number = other numbers. A column headed Price/Total that already holds the line total (quantity x it would not give the subtotal) is amount, not unit_price.
- Grouped reports (a group/customer header row, its lines, then a subtotal row such as "Total for X"): keep header, line and subtotal rows in rows, in printed order, and mark each in row_kinds. Aging reports: bucket columns (Current, 1-30, 31-60 ... 90+) are number and the outstanding/total column is row_total.
- Handwriting and tick marks: transcribe literally ONLY in handwritten_notes and list them in low_confidence_fields. If handwriting or a signature cannot be read with confidence, write "[illegible]" or "[signature]" - never guess names or words. Printed stamp text that overlaps handwriting belongs to stamps_and_chops. Never put handwriting into fields, parties, tables or totals: a printed label whose space is blank, or only has handwriting written over/next to it, gets value null.
- Letter O vs digit 0, I/l vs 1, S vs 5, B vs 8: decide from context (account numbers, IDs and phone numbers are mostly digits; email domains are real words such as jaring.my, gmail.com).
- A party's name is the name only: a registration or tax number printed next to it goes in registration_no / tax_id, not in name.
- registration_no is only a company registration number printed as such (e.g. "(279018-W)", "Co. No.", "Reg. No.", "SSM"). Branch, store, outlet or customer codes are not registration numbers: put them in fields.
- Parties come only from printed letterheads / address blocks (e.g. "Billing Address", "Delivery Address", "Bill To"). A rubber stamp, company chop or "Received by" stamp is NOT a party: put it only in stamps_and_chops.
- Labels: read each small label carefully and copy it exactly; never rename it. Digits that belong to a label (e.g. the "1" in "Ref 1:") are not its value. If the space after a label is empty, its value is null.
Raw JSON only, no markdown.`;

    (tb.rows||[]).forEach((row,ri)=>(row||[]).forEach((v,ci)=>P(`table: ${tn}`,ri+1,cols[ci]||`col ${ci+1}`,v)));
    if(Array.isArray(tb.total_row))tb.total_row.forEach((v,ci)=>P(`table: ${tn}`,"TOTAL",cols[ci]||`col ${ci+1}`,v))});
  (r.stamps_and_chops||[]).forEach((x,i)=>P("stamp",i+1,x?.position||"",x?.text??x));(r.handwritten_notes||[]).forEach((x,i)=>P("handwriting",i+1,x?.position||"",x?.text??x));(r.notes||[]).forEach((x,i)=>P("note",i+1,"",x?.text??x));
  return out}
$("#csvall").onclick=()=>{const L=[["file","page","section","item","label","value"].map(q).join(",")];
  allResults().forEach(res=>res.segments.forEach(s=>{const [,r]=best(s);if(r)flatRows(res.source_document,s.segment_identifier,r).forEach(x=>L.push(x.map(q).join(",")))}));
  dlBlob(`invoicelens_all_fields_${stamp()}.csv`,"\ufeff"+L.join("\n"),"text/csv")};
$("#csvsum").onclick=()=>{const cols=["file","status","duplicate_of","tokens_in","tokens_out","est_cost","manual_edits","document_type","document_number","document_date","counterparty","currency","grand_total","table_rows","issues"];
  const lines=[cols.join(",")];JOBS.filter(j=>j.result||j.error).forEach(j=>{const sg=j.result?.segments[0],r=sg&&best(sg)[1];const party=r?.parties?.find(p=>p.role!=="issuer"&&p.role!=="supplier")||r?.parties?.[0];
    const iss=j.result?j.result.segments.flatMap(x=>issues(x).filter(i=>i[0]==="bad"||i[0]==="warn").map(i=>`${i[1]}: ${i[2]}`)).join(" | "):j.error;
    const u=usageOf(j.result),c=costOf(u);lines.push([j.file.name,STATUS[j.status][1],DUPMAP.get(j.id)||"",u.a.in+u.b.in,u.a.out+u.b.out,c==null?"":c.toFixed(6),j.result?j.result.segments.reduce((a,x)=>a+(x.manual_edits?.length||0),0):0,r?.document_type,r?.document_number,r?.document_date,party?.name,r?.currency,r?.grand_total,r?(r.tables||[]).reduce((a,t)=>a+(t.rows||[]).length,0):"",iss].map(q).join(","))});
  dlBlob(`invoicelens_summary_${stamp()}.csv`,"﻿"+lines.join("\n"),"text/csv")};
