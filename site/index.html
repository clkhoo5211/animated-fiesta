<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vision Pipeline</title>
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#e2e2dc;--ac:#2f5bd3}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecece8;--mut:#9a9a93;--card:#1e1e1c;--bd:#33332f;--ac:#7b9cff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:24px 16px}h1{font-size:22px;margin:0 0 4px}p.s{color:var(--mut);margin:0 0 20px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}input[type=password],input[type=text]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer;margin-top:12px}button:disabled{opacity:.5}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);padding:12px;border-radius:6px;max-height:600px;overflow:auto}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{height:90px;border:1px solid var(--bd);border-radius:4px}
#log{color:var(--mut);font-size:13px}
</style>
</head>
<body><main>
<h1>Unified Vision Pipeline</h1>
<p class="s">图片 / PDF / 视频 → 本地 QR·条码 + PDF 文本层 → OpenAI & Anthropic 视觉抽取 → 交叉核验。全部在浏览器运行，密钥只存在本页内存。</p>
<div class="c">
<label>OpenAI 兼容 Base URL（OpenAI / DeepSeek / 通义 / OpenRouter / 中转站…）</label><input id="ob" type="text" value="https://api.openai.com/v1" list="presets">
<datalist id="presets"><option value="https://api.openai.com/v1"><option value="https://openrouter.ai/api/v1"><option value="https://dashscope.aliyuncs.com/compatible-mode/v1"><option value="https://generativelanguage.googleapis.com/v1beta/openai"><option value="https://api.deepseek.com/v1"></datalist>
<label>CORS 代理 URL（可选，遇到 CORS 报错时填，如 https://vision-cors-proxy.xxx.workers.dev）</label><input id="px" type="text" placeholder="留空 = 浏览器直连">
<label>API Key（可选）</label><input id="ok" type="password" autocomplete="off">
<label>模型（需支持图片输入）</label><input id="om" type="text" value="gpt-4o">
<label><input id="jm" type="checkbox" checked style="width:auto"> 使用 JSON 模式（服务商报错时取消勾选）</label>
<label>Anthropic API Key（可选）</label><input id="ak" type="password" autocomplete="off">
<label>Anthropic 模型</label><input id="am" type="text" value="claude-sonnet-5-5">
<label>文件</label><input id="f" type="file" accept="image/*,.pdf,video/*">
<button id="go">运行</button> <span id="log"></span>
</div>
<div class="c"><div class="thumbs" id="th"></div></div>
<div class="c"><pre id="out">结果将显示在这里</pre></div>
</main>
<script type="module">
const PDFJS="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/";
const ZXING="https://cdn.jsdelivr.net/npm/zxing-wasm@1.2.11/dist/es/reader/index.js";
let _pdf,_zx;
const loadPdf=async()=>{if(!_pdf){try{_pdf=await import(PDFJS+"pdf.min.mjs");_pdf.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.mjs";}catch(e){throw new Error("PDF 库加载失败（网络/CDN）："+e.message)}}return _pdf};
const loadZx=async()=>_zx||(_zx=await import(ZXING));
window.addEventListener("error",e=>{const l=document.getElementById("log");if(l)l.textContent="脚本错误："+e.message});
const $=id=>document.getElementById(id), log=t=>$("log").textContent=t;
const PROMPT=`You are an invoice data extractor. Read the image carefully and return ONE JSON object with exactly this shape (use null when absent, keep numbers as strings exactly as printed, never guess digits):
{"supplier":{"name","registration_no","tin","address","phone"},
 "invoice":{"invoice_no","date","customer_account","sales_executive","page","payment_terms","reference"},
 "bill_to":{"name","registration_no","tin","address","attn","tel"},
 "deliver_to":{"name","address"},
 "line_items":[{"no","item_code","description","qty","uom","unit_price","discount","line_total"}],
 "totals":{"currency","subtotal","tax","total_payable","amount_in_words"},
 "stamps_and_chops":[{"text","position"}],
 "handwritten_notes":[{"text","position"}],
 "low_confidence_fields":["dot.path of any field you are unsure about"]}
Raw JSON only, no markdown.`;
const canvasToJpeg=c=>c.toDataURL("image/jpeg",0.85).split(",")[1];
const b64ToBlob=b=>new Blob([Uint8Array.from(atob(b),ch=>ch.charCodeAt(0))],{type:"image/jpeg"});
const parseJSON=t=>{t=t.trim().replace(/^```(?:json)?\s*|\s*```$/g,"");try{return JSON.parse(t)}catch{const m=t.match(/\{[\s\S]*\}/);return m?JSON.parse(m[0]):{raw:t}}};

async function ingest(file){
  const n=file.name.toLowerCase(), segs=[];
  if(file.type==="application/pdf"||n.endsWith(".pdf")){
    const pdfjs=await loadPdf();const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;
    for(let i=1;i<=pdf.numPages;i++){
      const p=await pdf.getPage(i), vp=p.getViewport({scale:2}), c=document.createElement("canvas");
      c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      const text=(await p.getTextContent()).items.map(x=>x.str).join(" ");
      segs.push({id:`Page_${i}`,b64:canvasToJpeg(c),text});
    }
  }else if(file.type.startsWith("video/")){
    const v=document.createElement("video");v.muted=true;v.src=URL.createObjectURL(file);
    await new Promise((r,j)=>{v.onloadedmetadata=r;v.onerror=()=>j(new Error("视频无法解码"))});
    for(const [k,fr] of [0.25,0.5,0.75].entries()){
      v.currentTime=v.duration*fr;await new Promise(r=>v.onseeked=r);
      const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
      segs.push({id:`Video_Frame_${k+1}_${fr*100}pct`,b64:canvasToJpeg(c),text:""});
    }
  }else if(file.type.startsWith("image/")){
    const bmp=await createImageBitmap(file),c=document.createElement("canvas");c.width=bmp.width;c.height=bmp.height;c.getContext("2d").drawImage(bmp,0,0);
    segs.push({id:"Image_1",b64:canvasToJpeg(c),text:""});
  }
  return segs;
}
const num=v=>{const n=parseFloat(String(v??"").replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n};
function arithmetic(r){
  if(!r||r.error||!Array.isArray(r.line_items))return null;
  const issues=[];let sum=0;
  r.line_items.forEach((it,k)=>{const q=num(it.qty),p=num(it.unit_price),t=num(it.line_total),d=num(it.discount)||0;
    if(t!=null)sum+=t;
    if(q!=null&&p!=null&&t!=null&&Math.abs(q*p-d-t)>0.011)issues.push(`line ${k+1}: ${q} × ${p}${d?` − ${d}`:""} = ${(q*p-d).toFixed(2)} ≠ ${t}`);});
  const tp=num(r.totals?.total_payable);
  if(tp==null)issues.push("total_payable missing");
  else if(Math.abs(sum+(num(r.totals?.tax)||0)-tp)>0.011)issues.push(`sum of lines ${sum.toFixed(2)} (+tax) ≠ total_payable ${tp}`);
  return {lines_sum:sum.toFixed(2),total_payable:r.totals?.total_payable??null,passed:issues.length===0,issues};
}
async function decodeScaled(seg,scale){
  const bmp=await createImageBitmap(b64ToBlob(seg.b64)),c=document.createElement("canvas");
  c.width=bmp.width*scale;c.height=bmp.height*scale;const x=c.getContext("2d");x.imageSmoothingEnabled=false;x.filter="grayscale(1) contrast(1.6)";x.drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/png"));
}
async function local(seg){
  try{const {readBarcodesFromImageFile}=await loadZx();const opt={tryHarder:true,maxNumberOfSymbols:20};
    let r=(await readBarcodesFromImageFile(b64ToBlob(seg.b64),opt)).filter(x=>x.isValid);
    for(const sc of [2,3]){if(r.length)break;r=(await readBarcodesFromImageFile(await decodeScaled(seg,sc),opt)).filter(x=>x.isValid);}
    return {qr_and_barcodes:r.filter(x=>x.isValid).map(x=>({type:x.format,data:x.text})),native_extracted_text:seg.text};}
  catch(e){return {qr_and_barcodes:[],native_extracted_text:seg.text,error:String(e)}}
}
async function openai(key,model,content,base,json,proxy){
  const h={"Content-Type":"application/json",Authorization:`Bearer ${key}`};if(proxy)h["X-Target-Base"]=base;
  const r=await fetch((proxy||base).replace(/\/+$/,"")+"/chat/completions",{method:"POST",headers:h,
    body:JSON.stringify({model,...(json?{response_format:{type:"json_object"}}:{}),max_tokens:2000,messages:[{role:"user",content}]})}).catch(e=>{throw new Error(`无法连接 ${base}${proxy?"（经代理）":"（可能是 CORS：请填写代理 URL）"}`)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error?.message||`HTTP ${r.status}`);return parseJSON(j.choices[0].message.content);
}
async function anthropic(key,model,content){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model,max_tokens:2000,messages:[{role:"user",content}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);return parseJSON(j.content.find(b=>b.type==="text").text);
}
const safe=p=>p.catch(e=>({error:String(e.message||e)}));
async function processSeg(seg,cfg){
  const hint=seg.text?`\n\nPDF text layer for reference:\n${seg.text.slice(0,6000)}`:"";
  const [loc,oa,an]=await Promise.all([local(seg),
    cfg.ok?safe(openai(cfg.ok,cfg.om,[{type:"text",text:PROMPT+hint},{type:"image_url",image_url:{url:`data:image/jpeg;base64,${seg.b64}`}}],cfg.ob,cfg.jm,cfg.px)):{status:"skipped"},
    cfg.ak?safe(anthropic(cfg.ak,cfg.am,[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:seg.b64}},{type:"text",text:PROMPT+hint}])):{status:"skipped"}]);
  let audit={};
  if(cfg.ok&&cfg.ak){
    if(oa.error||an.error)audit={status:"Verification Bypassed",reason:"A provider failed."};
    else{const q=`You are a strict data auditor. Compare two extractions of the same document.\nA (OpenAI): ${JSON.stringify(oa)}\nB (Anthropic): ${JSON.stringify(an)}\nReturn JSON with 'consensus_data' (fields both agree on) and 'discrepancy_flags' (each with field, value_a, value_b). Raw JSON only.`;
      audit=await safe(anthropic(cfg.ak,cfg.am,[{type:"text",text:q}]));}
  }
  return {segment_identifier:seg.id,local_extraction:loc,provider_responses:{openai_compatible:oa,anthropic:an},arithmetic_check:{openai_compatible:arithmetic(oa),anthropic:arithmetic(an)},cross_verification_audit:audit};
}
$("go").onclick=async()=>{
  if(!$("ok").value.trim()&&!$("ak").value.trim())log("提示：未填任何 API Key，只做本地条码/文本识别");
  const file=$("f").files[0];if(!file)return log("请先选择文件");
  const cfg={ok:$("ok").value.trim(),ak:$("ak").value.trim(),om:$("om").value.trim(),ob:($("ob").value.trim()||"https://api.openai.com/v1").replace(/\/+$/,"").replace(/\/(models|chat\/completions)$/,""),jm:$("jm").checked,px:$("px").value.trim(),am:$("am").value.trim()};
  $("go").disabled=true;$("th").innerHTML="";
  try{log("解析文件…");const segs=await ingest(file);if(!segs.length)throw new Error("不支持的文件类型");
    segs.forEach(s=>{const i=new Image();i.src=`data:image/jpeg;base64,${s.b64}`;i.title=s.id;$("th").append(i)});
    log(`并发处理 ${segs.length} 个片段…`);
    const out=[];for(let i=0;i<segs.length;i+=3)out.push(...await Promise.all(segs.slice(i,i+3).map(s=>processSeg(s,cfg))));
    $("out").textContent=JSON.stringify({source_document:file.name,total_extracted_segments:out.length,segments:out},null,2);log("完成");
  }catch(e){log("错误："+e.message)}finally{$("go").disabled=false}
};
</script>
</body></html>
